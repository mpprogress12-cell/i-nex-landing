<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вхід для учасників · I-NEX</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0E1A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Montserrat:wght@600;700;800;900&family=Poppins:wght@700;900&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230A0E1A'/%3E%3Ccircle cx='74' cy='30' r='20' fill='%23FF6B00'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="auth">
    <div class="auth-card">
      <a href="index.html" class="auth-logo logo">
        <span class="logo-mark">i-nex</span>
        <span class="logo-tag">SYSTEM OVER CHAOS</span>
      </a>

      <div class="auth-head">
        <span class="h">Логін</span>
        <span class="sep">/</span>
        <a href="index.html#register">Реєстрація</a>
      </div>

      <form class="register-form" id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginEmail">Робочий / корпоративний e-mail <span class="required">*</span></label>
          <input type="email" id="loginEmail" name="loginEmail" placeholder="ivan@company.com" required autocomplete="username">
          <span class="error-message" data-for="loginEmail"></span>
        </div>
        <div class="form-group">
          <label for="loginPass">Пароль <span class="required">*</span></label>
          <input type="password" id="loginPass" name="loginPass" placeholder="••••••••" required autocomplete="current-password">
          <span class="error-message" data-for="loginPass"></span>
        </div>

        <a href="#" class="auth-forgot" id="forgotLink">Відновити пароль ✉️</a>

        <button type="submit" class="btn btn-primary btn-full">Увійти</button>
        <div class="form-status" id="loginStatus"></div>
      </form>

      <p class="auth-note">
        Доступ — лише для учасників навчальної програми I-NEX.
        У разі питань <a href="mailto:mariia.halai@gmail.com">напишіть нам</a>
        або телефонуйте Марії: <a href="tel:+380672595015">+380 67 259 50 15</a>.
      </p>
      <a href="index.html" class="auth-back">← На головну</a>
    </div>
  </main>

  <script src="js/main.js" defer></script>
</body>
</html>
