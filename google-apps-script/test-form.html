<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест форми реєстрації — I-NEX AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f7f8fa;
      color: #1f2328;
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 560px;
      margin: 0 auto;
      background: #fff;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }
    h1 { margin-top: 0; font-size: 24px; }
    .hint {
      color: #656d76;
      font-size: 14px;
      margin-bottom: 24px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
    }
    .required label::after {
      content: " *";
      color: #cf222e;
    }
    input, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #0969da;
    }
    textarea { min-height: 72px; resize: vertical; }
    button {
      width: 100%;
      padding: 14px;
      background: #0969da;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0550ae; }
    button:disabled { background: #8c959f; cursor: not-allowed; }
    .status {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .status.success { background: #dafbe1; color: #1a7f37; display: block; }
    .status.error { background: #ffebe9; color: #cf222e; display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Тест форми реєстрації</h1>
    <p class="hint">
      Вставте URL вашого Web App у поле нижче та відправте тестову заявку.
    </p>

    <form id="test-form">
      <div class="required">
        <label for="scriptUrl">URL Web App Google Apps Script</label>
        <input type="url" id="scriptUrl" name="scriptUrl"
               placeholder="https://script.google.com/macros/s/.../exec" required>
      </div>

      <div class="required">
        <label for="fullName">Прізвище та ім'я</label>
        <input type="text" id="fullName" name="fullName" placeholder="Іваненко Іван" required>
      </div>

      <div class="required">
        <label for="company">Назва компанії</label>
        <input type="text" id="company" name="company" placeholder="ТОВ «Майбутнє»" required>
      </div>

      <div class="required">
        <label for="position">Ваша посада</label>
        <input type="text" id="position" name="position" placeholder="Директор з операцій" required>
      </div>

      <div class="required">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="ivan@company.com" required>
      </div>

      <div class="required">
        <label for="phone">Номер телефону</label>
        <input type="tel" id="phone" name="phone" placeholder="+380 99 123 4567" required>
      </div>

      <div>
        <label for="industry">Сфера діяльності компанії (опціонально)</label>
        <input type="text" id="industry" name="industry" placeholder="Retail, IT, виробництво...">
      </div>

      <div>
        <label for="colleague">Чи плануєте участь з колегою? (опціонально)</label>
        <textarea id="colleague" name="colleague"
                  placeholder="Так, Петренко Петро, фінансовий директор"></textarea>
      </div>

      <button type="submit" id="submitBtn">Відправити тестову заявку</button>
    </form>

    <div id="status" class="status"></div>
  </div>

  <script>
    const form = document.getElementById('test-form');
    const submitBtn = document.getElementById('submitBtn');
    const statusEl = document.getElementById('status');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      statusEl.className = 'status';
      statusEl.style.display = 'none';
      statusEl.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Відправлення...';

      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());
      const scriptUrl = data.scriptUrl;
      delete data.scriptUrl;

      try {
        const response = await fetch(scriptUrl, {
          method: 'POST',
          body: new URLSearchParams(data),
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          }
        });

        let result;
        try {
          result = await response.json();
        } catch (jsonErr) {
          throw new Error('Сервер повернув не JSON. Перевірте URL Web App.');
        }

        if (result.status === 'success') {
          statusEl.className = 'status success';
          statusEl.textContent = result.message || 'Заявку успішно надіслано!';
          form.reset();
        } else {
          let msg = result.message || 'Помилка відправлення.';
          if (result.errors && result.errors.length) {
            msg += '\n\n' + result.errors.map(err => err.message).join('\n');
          }
          statusEl.className = 'status error';
          statusEl.textContent = msg;
        }
      } catch (err) {
        statusEl.className = 'status error';
        statusEl.textContent = "Помилка з'єднання: " + err.message;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Відправити тестову заявку';
      }
    });
  </script>
</body>
</html>
